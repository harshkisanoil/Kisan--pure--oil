<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Pure Oils | Harsh Pandey</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: linear-gradient(135deg, #fbc02d, #f57f17); color: #222; text-align: center; padding: 30px 15px; font-size: 26px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .container { max-width: 550px; margin: 20px auto; padding: 0 15px; }
        .card { background: #ffffff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; border-top: 4px solid #fbc02d; }
        .owner-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #fbc02d; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .target-box { background-color: #fffde7; border: 1px dashed #fbc02d; padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 14px; color: #d84315; font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #fbc02d; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 14px; width: 100%; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-email { background-color: #0073e6; color: white; padding: 14px; width: 100%; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .contact-info { font-size: 14px; color: #555; margin-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>

    <header>🌾 Shuddh Kachi Ghani Sarson Tel</header>

    <div class="container">
        <!-- Owner Profile Card -->
        <div class="card">
            <!-- Note: Website live karne par 'owner.jpg' ki jagah apni photo ka link dalein -->
            <img src="https://via.placeholder.com/130" alt="Harsh Pandey" class="owner-img">
            <h2 style="margin-top: 10px; color: #222;">Kisan Pure Oils</h2>
            <p style="color: #666; font-size: 15px;"><strong>Founder & Malik:</strong> Harsh Pandey</p>
            <div class="target-box">
                🚀 Hamara Target: Agle 2 Saal Mein ₹2.5 Crore Ki Company Banana!
            </div>

            <div class="contact-info">
                📍 100% Shuddh Kachi Ghani Sarson Tel Direct Khet Se<br>
                📞 <strong>Mobile:</strong> 8736956052<br>
                ✉️ <strong>Email:</strong> harshpanday8777@gmail.com
            </div>
        </div>

        <!-- Order Form Card -->
        <div class="card">
            <h3 style="margin-bottom: 15px; color: #222;">📦 Aasani Se Order Karein</h3>
            <!-- Email par direct form detail bhejne ke liye action tag -->
            <form action="https://formsubmit.co/harshpanday8777@gmail.com" method="POST" id="orderForm">
                <div class="form-group">
                    <label>Aapka Pura Naam:</label>
                    <input type="text" name="Naam" id="name" placeholder="Naam likhein" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number (WhatsApp):</label>
                    <input type="tel" name="Mobile" id="phone" placeholder="8736956052" required>
                </div>

                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" name="Email" id="email" placeholder="harshpanday8777@gmail.com">
                </div>

                <div class="form-group">
                    <label>Kitna Litre Tel Chahiye:</label>
                    <select name="Quantity" id="quantity">
                        <option value="1 Litre">1 Litre</option>
                        <option value="2 Litre">2 Litre</option>
                        <option value="5 Litre">5 Litre</option>
                        <option value="10 Litre">10 Litre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pura Address (Ghar Ka Pata):</label>
                    <textarea name="Address" id="address" rows="3" placeholder="Address likhein" required></textarea>
                </div>

                <!-- WhatsApp Notification Button -->
                <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">💬 Direct WhatsApp Par Order Bhejein</button>
                <!-- Email Notification Button -->
                <button type="submit" class="btn-email">✉️ Gmail Par Order Submit Karein</button>

            </form>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            var name = document.getElementById('name').value;
            var phone = document.getElementById('phone').value;
            var email = document.getElementById('email').value;
            var quantity = document.getElementById('quantity').value;
            var address = document.getElementById('address').value;

            if(name == "" || phone == "" || address == "") {
                alert("Kripya Naam, Mobile Number aur Address zaroor bharein!");
                return;
            }

            var myNumber = "918736956052"; 

            var message = "🌾 *Kisan Pure Oils - Naya Order!*" + "%0A%0A" +
                          "👤 *Customer Naam:* " + name + "%0A" +
                          "📞 *Phone:* " + phone + "%0A" +
                          "✉️ *Email:* " + email + "%0A" +
                          "🛢️ *Quantity:* " + quantity + "%0A" +
                          "🏠 *Address:* " + address;

            window.open("https://wa.me/" + myNumber + "?text=" + message, '_blank');
        }
    </script>
</body>
</html>
